name: RMG

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, features: ON, architecture: x86_64, configuration: Release }
          - { os: ubuntu-24.04, features: ON, architecture: x86_64, configuration: Debug }
          - { os: ubuntu-24.04, features: OFF, architecture: x86_64, configuration: Release }
          - { os: ubuntu-24.04, features: OFF, architecture: x86_64, configuration: Debug }
          - { os: ubuntu-24.04-arm, features: ON, architecture: aarch64, configuration: Release }
          - { os: ubuntu-24.04-arm, features: ON, architecture: aarch64, configuration: Debug }
          - { os: ubuntu-24.04-arm, features: OFF, architecture: aarch64, configuration: Release }
          - { os: ubuntu-24.04-arm, features: OFF, architecture: aarch64, configuration: Debug }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.architecture }}-${{ matrix.features }}-${{ matrix.configuration }}
      - name: Install Packages
        run: |
          # remove and disable snap, this fixes long update times
          # taken from https://github.com/ading2210/gh-actions-remove-snap/blob/main/workflow.sh
          sudo systemctl disable --now snapd
          sudo apt-get purge -y snapd
          echo "Package: snapd"    | sudo tee /etc/apt/preferences.d/disable-snap.pref
          echo "Pin: release a=*"  | sudo tee -a /etc/apt/preferences.d/disable-snap.pref
          echo "Pin-Priority: -10" | sudo tee -a /etc/apt/preferences.d/disable-snap.pref
          sudo apt-mark hold firefox

          sudo apt-get -y update
          sudo apt-get -y upgrade
          sudo apt-get -y install cmake libusb-1.0-0-dev libhidapi-dev libsamplerate0-dev libspeex-dev libminizip-dev libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config zlib1g-dev binutils-dev libspeexdsp-dev qt6-base-dev qt6-tools-dev qt6-translations-l10n libqt6svg6-dev libqt6websockets6-dev libvulkan-dev \
            build-essential nasm git zip appstream xvfb qt6ct mesa-vulkan-drivers

          # sdl3 dependencies
          sudo apt-get -y install build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
      - name: Prepare Environment
        run: |
          echo "GIT_REVISION=$(git describe --tags --always)" >> $GITHUB_ENV
      - name: Build SDL3
        run: |
          export sdl_dir="$(pwd)/../SDL3"

          git clone https://github.com/libsdl-org/SDL.git "$sdl_dir" -b release-3.2.28 --depth=1

          mkdir -p "$sdl_dir/build"
          cmake -S "$sdl_dir" -B "$sdl_dir/build" \
                -DCMAKE_BUILD_TYPE="Release" \
                -DCMAKE_INSTALL_PREFIX="/usr" \
                -DCMAKE_INSTALL_LIBDIR="lib/${{ matrix.architecture }}-linux-gnu" \
                -DCMAKE_INSTALL_FULL_LIBDIR="/usr/lib/${{ matrix.architecture }}-linux-gnu" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build "$sdl_dir/build" --parallel "$(nproc)"
          # -DCMAKE_INSTALL_PREFIX above (not just --prefix here) matters:
          # `cmake --install --prefix X` only overrides where files land, it
          # doesn't retroactively fix the prefix already baked into
          # generated files like sdl3.pc at configure time - that stayed
          # CMake's default (/usr/local) without the -D above, so pkg-config
          # kept reporting -I/usr/local/include/SDL3 even though the actual
          # headers were being installed under /usr/include/SDL3, breaking
          # anything (like the DEBUGGER=1 SDL_CFLAGS passthrough in
          # Source/3rdParty/CMakeLists.txt) that trusts pkg-config's output.
          sudo cmake --install "$sdl_dir/build" --prefix /usr/
      - name: Build RMG (AppImage)
        run: |
          export src_dir="$(pwd)"
          export build_dir="$(pwd)/Build/AppImage"
          export bin_dir="$(pwd)/Bin/AppImage"
    
          mkdir $build_dir Bin/ -p
          cmake -S "$src_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE="${{ matrix.configuration }}" \
                -DNETPLAY=${{ matrix.features }} \
                -DVRU=${{ matrix.features }} \
                -DUSE_ANGRYLION=${{ matrix.features }} \
                -DUPDATER=${{ matrix.features }} \
                -DAPPIMAGE_UPDATER=${{ matrix.features }} \
                -DPORTABLE_INSTALL=OFF \
                -DCMAKE_INSTALL_PREFIX="/usr" \
                -DCMAKE_INSTALL_LIBDIR="lib"  \
                -G "Unix Makefiles"

          cmake --build "$build_dir" --parallel "$(nproc)"
          cmake --install "$build_dir" --strip --prefix="$bin_dir/usr"
        shell: bash
      - name: Create AppImage
        if: ${{ matrix.features == 'ON' && matrix.architecture == 'x86_64' && matrix.configuration == 'Release' }}
        run: |
          ./Package/AppImage/Create.sh
        shell: bash
      - name: Upload RMG (AppImage)
        if: ${{ matrix.features == 'ON' && matrix.architecture == 'x86_64' && matrix.configuration == 'Release' }}
        uses: actions/upload-artifact@v5
        with:
          name: RMG-K-Portable-Linux64-${{ env.GIT_REVISION }}
          path: Bin/*.AppImage

  build-windows:
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - { features: ON, configuration: Release }
          - { features: ON, configuration: Debug }
          - { features: OFF, configuration: Release }
          - { features: OFF, configuration: Debug }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-${{ matrix.features }}-${{ matrix.configuration }}
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          msystem: ucrt64
          install: >-
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-qt6
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-speexdsp
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-vulkan-headers
            git
      - name: Install minizip 1.3.1
        shell: msys2 {0}
        run: |
          pacman -U --noconfirm \
            "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-minizip-1.3.1-1-any.pkg.tar.zst"
      - name: Prepare Environment
        run: |
          $env:revision = git describe --tags --always
          echo "GIT_REVISION=$env:revision" >> $env:GITHUB_ENV
        shell: pwsh
      # n02 Kaillera client is now compiled as a static library (Source/n02/)
      # No need to download kailleraclient.dll
      - name: Build RMG (Portable)
        run: |
          export src_dir="$(pwd)"
          export build_dir="$(pwd)/Build/${{ matrix.configuration }}"

          cmake -S "$src_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE="${{ matrix.configuration }}" \
                -DNETPLAY=${{ matrix.features }} \
                -DVRU=${{ matrix.features }} \
                -DUSE_ANGRYLION=${{ matrix.features }} \
                -DUPDATER=${{ matrix.features }} \
                -DPORTABLE_INSTALL=ON \
                -G "MSYS Makefiles"

          cmake --build "$build_dir" --parallel "$(nproc)"
          cmake --install "$build_dir" --strip --prefix="$src_dir"
          cmake --build "$build_dir" --target=bundle_dependencies
        shell: msys2 {0}
      - name: Create Installer
        if: ${{ matrix.features == 'ON' && matrix.configuration == 'Release' }}
        run: .\Build\Release\Source\Installer\CreateInstaller.bat
      - name: Configure RMG (Portable)
        if: ${{ matrix.features == 'ON' && matrix.configuration == 'Release' }}
        run: touch Bin/Release/portable.txt
        shell: msys2 {0}
      - name: Upload RMG (Portable)
        if: ${{ matrix.features == 'ON' && matrix.configuration == 'Release' }}
        uses: actions/upload-artifact@v5
        with:
          name: RMG-K-Portable-Windows64-${{ env.GIT_REVISION }}
          path: Bin/Release/*
      - name: Upload RMG (Installer)
        if: ${{ matrix.features == 'ON' && matrix.configuration == 'Release' }}
        uses: actions/upload-artifact@v5
        with:
          name: RMG-K-Setup-Windows64-${{ env.GIT_REVISION }}
          path: Bin/*.exe

  # Experimental: Windows 7 SP1 compatible portable build.
  # Qt 6 officially needs Windows 10, so Qt is built from source with the
  # community Windows 7 backport patches (https://github.com/crystalidea/qt6windows7).
  # SDL3 is built from source with a Windows 7 target, and the Universal CRT is
  # shipped app-local (the Windows 7 machine does not need KB2999226).
  build-windows7:
    runs-on: windows-2025
    env:
      QT_VERSION: 6.8.4
      QT_PREFIX: C:/Qt6-win7
      SDL_VERSION: release-3.2.28
      WIN7_FLAGS: -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -DNTDDI_VERSION=0x06010000
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows7-Release
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          msystem: ucrt64
          install: >-
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-speexdsp
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-vulkan-headers
            git
            curl
            xz
      - name: Install minizip 1.3.1
        shell: msys2 {0}
        run: |
          pacman -U --noconfirm \
            "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-minizip-1.3.1-1-any.pkg.tar.zst"
      - name: Prepare Environment
        run: |
          $env:revision = git describe --tags --always
          echo "GIT_REVISION=$env:revision" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Build SDL3
        shell: msys2 {0}
        run: |
          # SDL3 needs the Windows 8+ headers to compile (Gaming Input etc.) but
          # loads those APIs at runtime, so it is built with default flags.
          git clone https://github.com/libsdl-org/SDL.git ../SDL3 -b "$SDL_VERSION" --depth=1
          cmake -S ../SDL3 -B ../SDL3/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$(cygpath -m /ucrt64)" \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF
          cmake --build ../SDL3/build --parallel "$(nproc)"
          cmake --install ../SDL3/build
      - name: Restore Qt (Windows 7 patched)
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:/Qt6-win7
          # bump the suffix when changing the Qt build steps below
          key: qt-win7-${{ env.QT_VERSION }}-mingw-ucrt-v1
      - name: Build Qt (Windows 7 patched)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -ex
          qt_prefix="$(cygpath -m "$QT_PREFIX")"
          work="$(cygpath -u "$RUNNER_TEMP")/qtbuild"
          mkdir -p "$work" && cd "$work"
          base_url="https://download.qt.io/archive/qt/${QT_VERSION%.*}/$QT_VERSION/submodules"

          git clone https://github.com/crystalidea/qt6windows7.git --branch "v$QT_VERSION" --depth 1 patches

          for module in qtbase qtsvg qtwebsockets qttools qttranslations
          do
            curl -fL --retry 5 -o "$module.tar.xz" "$base_url/$module-everywhere-src-$QT_VERSION.tar.xz"
            tar xf "$module.tar.xz"
            mv "$module-everywhere-src-$QT_VERSION" "$module"
          done

          # overlay the Windows 7 backport onto qtbase
          cp -rf patches/qtbase/. qtbase/

          # newer GCC versions need <cstdint> etc. in older Qt headers
          qt_flags="-include cstdint"

          cmake -S qtbase -B build-qtbase -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$qt_prefix" \
                -DCMAKE_C_FLAGS="$qt_flags" -DCMAKE_CXX_FLAGS="$qt_flags" \
                -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF \
                -DINPUT_opengl=desktop \
                -DFEATURE_openssl=ON -DFEATURE_openssl_linked=OFF \
                -DFEATURE_sql=OFF -DFEATURE_dbus=OFF
          cmake --build build-qtbase --parallel "$(nproc)"
          cmake --install build-qtbase

          for module in qtsvg qtwebsockets qttools qttranslations
          do
            extra=()
            if [ "$module" = qttools ]
            then
              extra=(-DFEATURE_assistant=OFF -DFEATURE_designer=OFF -DFEATURE_qdoc=OFF
                     -DFEATURE_pixeltool=OFF -DFEATURE_distancefieldgenerator=OFF
                     -DFEATURE_qtattributionsscanner=OFF -DFEATURE_qtdiag=OFF
                     -DFEATURE_qtplugininfo=OFF -DFEATURE_kmap2qmap=OFF)
            fi
            cmake -S "$module" -B "build-$module" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_PREFIX_PATH="$qt_prefix" \
                  -DCMAKE_INSTALL_PREFIX="$qt_prefix" \
                  -DCMAKE_C_FLAGS="$qt_flags" -DCMAKE_CXX_FLAGS="$qt_flags" \
                  -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF "${extra[@]}"
            cmake --build "build-$module" --parallel "$(nproc)"
            cmake --install "build-$module"
          done
      - name: Build RMG (Portable, Windows 7)
        shell: msys2 {0}
        run: |
          export src_dir="$(pwd)"
          export build_dir="$(pwd)/Build/Release"
          export RMG_QT_BIN="$(cygpath -u "$QT_PREFIX")/bin"
          export PATH="$RMG_QT_BIN:$PATH"

          # -O3 is spelled out because the 3rdParty makefiles use CMAKE_C_FLAGS verbatim as OPTFLAGS
          cmake -S "$src_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_PREFIX")" \
                -DCMAKE_C_FLAGS="-O3 $WIN7_FLAGS" \
                -DCMAKE_CXX_FLAGS="-O3 $WIN7_FLAGS" \
                -DNETPLAY=ON \
                -DVRU=ON \
                -DUSE_ANGRYLION=ON \
                -DUPDATER=OFF \
                -DPORTABLE_INSTALL=ON \
                -G "MSYS Makefiles"

          cmake --build "$build_dir" --parallel "$(nproc)"
          cmake --install "$build_dir" --strip --prefix="$src_dir"
          cmake --build "$build_dir" --target=bundle_dependencies
      - name: Bundle Universal CRT (app-local)
        shell: msys2 {0}
        run: |
          ucrt_dir="/c/Program Files (x86)/Windows Kits/10/Redist/ucrt/DLLs/x64"
          ls "$ucrt_dir"
          cp "$ucrt_dir"/*.dll Bin/Release/
      - name: Check for Windows 8+ imports
        shell: msys2 {0}
        run: |
          ./Source/Script/CheckWin7Imports.sh Bin/Release | tee Bin/Release/win7-import-report.txt
      - name: Configure RMG (Portable)
        run: touch Bin/Release/portable.txt
        shell: msys2 {0}
      - name: Upload RMG (Portable, Windows 7)
        uses: actions/upload-artifact@v5
        with:
          name: RMG-K-Portable-Windows7-64-${{ env.GIT_REVISION }}
          path: Bin/Release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version from tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release

          # Find and move Linux AppImage
          find artifacts -name "*.AppImage" -exec cp {} release/ \;

          # Zip Windows portable build
          if [ -d "artifacts/RMG-K-Portable-Windows64-${{ env.VERSION }}" ]; then
            cd "artifacts/RMG-K-Portable-Windows64-${{ env.VERSION }}"
            zip -r "../../release/RMG-K-Portable-Windows64-${{ env.VERSION }}.zip" .
            cd ../..
          fi

          # Copy Windows installer
          find artifacts -name "RMG-K-Setup*.exe" -exec cp {} release/ \;

          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
